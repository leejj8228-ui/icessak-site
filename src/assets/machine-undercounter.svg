<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" role="img" aria-label="언더카운터형 제빙기 그림">
<!-- 언더카운터(일체형) 제빙기 일러스트: 특정 제조사 제품이 아닌 일반형 -->
<defs>
<linearGradient id="st" x1="0" x2="1"><stop offset="0" stop-color="#e9eef2"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#d7dfe6"/></linearGradient>
<linearGradient id="dk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe3f6"/><stop offset="1" stop-color="#9fc3e6"/></linearGradient>
</defs>
<ellipse cx="120" cy="248" rx="92" ry="7" fill="#111a23" opacity=".08"/>
<rect x="34" y="20" width="172" height="216" rx="6" fill="url(#st)" stroke="#9fb0bf" stroke-width="2"/>
