<filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".01" numOctaves="3" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .66  0 0 0 0 .76  .45 0 0 0 -.2"/></filter>
<rect width="320" height="320" filter="url(#g)" opacity=".35"/>
