<rect x="66" y="110" width="108" height="56" rx="4" fill="url(#dk)" opacity=".9"/>
<g fill="#ffffff" stroke="#7fa9cf" stroke-width="1.5" opacity=".95">
<rect x="74" y="140" width="18" height="18" rx="3"/><rect x="94" y="138" width="18" height="18" rx="3"/><rect x="114" y="141" width="18" height="18" rx="3"/><rect x="134" y="139" width="18" height="18" rx="3"/><rect x="152" y="142" width="16" height="16" rx="3"/>
<rect x="84" y="123" width="18" height="18" rx="3"/><rect x="106" y="121" width="18" height="18" rx="3"/><rect x="128" y="124" width="18" height="18" rx="3"/>
</g>
<path d="M70 114l20-2" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
